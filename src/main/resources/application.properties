spring.application.name=personal-record-api

spring.datasource.url=${PERSONAL_RECORDS_DB_URL:jdbc:h2:file:${user.home}/.personal-records/personalrecords;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${PERSONAL_RECORDS_DB_USERNAME:sa}
spring.datasource.password=${PERSONAL_RECORDS_DB_PASSWORD:}

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=12h
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
